anti_rules:
- Never rank cameras by price alone.
- Never state that an AI image was literally captured by a camera unless it was.
- Never assume a brand guarantees a visual style.
- Validate lens image-circle coverage.
- Validate exact crop/fps/shutter/codec mode.
- Manufacturer dynamic-range numbers are not perfectly standardized across brands.
