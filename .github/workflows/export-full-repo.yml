name: Export full repository source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-full-repo.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: zip -r ai-creative-director-skill-full.zip . -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-creative-director-skill-full
          path: ai-creative-director-skill-full.zip
          if-no-files-found: error
          retention-days: 1
