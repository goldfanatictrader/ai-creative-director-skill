name: Repository QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install --upgrade jsonschema PyYAML
      - name: Run repository QA
        run: python scripts/qa_repo.py
